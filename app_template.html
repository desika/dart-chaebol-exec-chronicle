<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{CO_NAME}} 임원 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3efe6; --panel:#faf8f3; --panel2:#efeadf; --ink:#17181c; --ink2:#3d3c38; --mute:#6c6a63; --hair:#d9d3c6; --hair2:#c6bfae;
  --ox:#8c2f39; --navy:#1f3a5f;
  --t1:#1baf7a; --t2:#2a78d6; --t3:#c98500; --tjm:#e87ba4; --tgray:#b9b3a6; --tsecom:#c9a35a;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6; --c7:#008300; --c8:#8a8578;
  --serif:"Noto Serif KR",serif; --sans:"IBM Plex Sans KR","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans)}
:root{--page:1600px}
body{min-width:var(--page)}
.top,main{width:var(--page);margin:0 auto;box-sizing:border-box}
a{color:inherit;text-decoration:none}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:28px 40px 0;border-bottom:1px solid var(--ink)}
.top-bg{border-bottom:1px solid var(--ink)}.brand{min-width:0;flex:1 1 auto}nav.tabs{flex:0 0 auto}
.brand h1{font:700 30px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.brand h1 em{font-style:normal;color:var(--ox)}
.brand .sub{color:var(--mute);font-size:12.5px;margin:6px 0 14px;letter-spacing:.02em}
.brand .sub b{color:var(--ink2);font-weight:500}
nav.tabs{display:flex;gap:2px}
nav.tabs a{white-space:nowrap;padding:10px 14px 12px;font-size:13.5px;font-weight:500;color:var(--mute);border:1px solid transparent;border-bottom:none;position:relative;top:1px}
nav.tabs a.on{color:var(--ink);background:var(--panel);border-color:var(--ink);border-bottom:1px solid var(--panel)}
nav.tabs a:hover{color:var(--ink)}
main{padding:26px 40px 60px}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--hair);padding:18px 20px;flex:1 1 320px;min-width:0;overflow:hidden}
.panel h2{font:600 15px/1.3 var(--serif);margin:0 0 10px;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
.panel h2 small{font:400 12px var(--sans);color:var(--mute)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--hair);margin:0 0 20px}
.fact{padding:12px 14px 12px 0;border-right:1px solid var(--hair);padding-left:14px}
.fact:first-child{padding-left:0}.fact:last-child{border-right:none}
.fact b{display:block;font:600 26px/1.1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.02em}
.fact b i{font-style:normal;font-size:14px;color:var(--mute);margin-left:2px}
.fact span{font-size:12px;color:var(--mute)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:13px}
.tools label{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--hair2);background:var(--panel);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--ink2);user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select,input[type=search]{font:13px var(--sans);padding:6px 9px;border:1px solid var(--hair2);background:#fff;border-radius:4px;color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--ink);white-space:nowrap;cursor:pointer;background:var(--panel);position:sticky;top:0;z-index:1}
table.t th.sorted:after{content:" ↓";color:var(--mute)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--hair);vertical-align:top;white-space:nowrap}
table.t td.wrap,table.t td.raw{white-space:normal;max-width:420px}
table.t td.wrap2{white-space:normal;min-width:150px;max-width:260px;line-height:1.45}
table.t tr:hover td{background:#f1ece0}
table.t td.n{font-family:var(--sans);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t td .tag{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--hair2);border-radius:3px;color:var(--ink2);margin-right:4px;background:#fff}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--hair)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0}
.legend i{display:inline-block;width:14px;height:10px;vertical-align:-1px;margin-right:5px;border-radius:2px}
.legend i.hatch{background:repeating-linear-gradient(135deg,#b9b3a6 0 2px,transparent 2px 5px);border:1px solid #b9b3a6}
.tip{position:fixed;pointer-events:none;background:#17181c;color:#f3efe6;padding:9px 12px;font-size:12.5px;line-height:1.5;border-radius:4px;max-width:360px;z-index:50;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip b{color:#fff}.tip .m{color:#bdb6a6}
svg text{font-family:var(--sans)}
svg .mono{font-family:var(--mono)}
.tl-wrap{overflow:auto;border:1px solid var(--hair);background:var(--panel)}
.tl-wrap svg{display:block}
.tl-row:hover rect.bg{fill:#ece6d8}
.name-link{cursor:pointer}
.name-link:hover{fill:var(--ox)}
.kv{display:grid;grid-template-columns:minmax(140px,max-content) 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--mute);white-space:nowrap}.kv dd{margin:0}
.person-head{display:flex;gap:26px;align-items:flex-start;border-bottom:1px solid var(--ink);padding-bottom:18px;margin-bottom:18px;flex-wrap:wrap}
.person-head h1{font:700 34px/1.1 var(--serif);margin:0 0 4px}
.person-head .meta{color:var(--mute);font-size:13px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11.5px;padding:2px 9px;border-radius:3px;border:1px solid var(--hair2);background:#fff;color:var(--ink2)}
.badge.ox{border-color:var(--ox);color:var(--ox)}.badge.navy{border-color:var(--navy);color:var(--navy)}
.changed{background:#fbe9c8 !important}
.rail{position:relative;padding-left:92px;margin:6px 0}
.rail:before{content:"";position:absolute;left:76px;top:4px;bottom:4px;width:1px;background:var(--hair2)}
.rail .it{position:relative;padding:3px 0 7px}
.rail .it .y{position:absolute;left:-92px;width:66px;text-align:right;font:500 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--mute)}
.rail .it .y i{font-style:normal;color:#a39c8c;font-size:11px;margin-left:3px}
.rail .it:before{content:"";position:absolute;left:-21px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--ink);border:2px solid var(--panel)}
.rail .it.edu:before{background:var(--c4)}
.rail .it.appt:before{background:var(--ox);width:9px;height:9px;left:-22px;top:8px}
.rail .it .t{font-size:13.5px}
.rail .it .t small{color:var(--mute);margin-left:6px}
.rel a{display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;border:1px solid var(--hair2);border-radius:3px;font-size:12.5px;background:#fff}
.rel a:hover{border-color:var(--ox);color:var(--ox)}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:10px;font-size:12.5px}
.bar .b{height:14px;background:var(--navy);border-radius:0 3px 3px 0;min-width:2px}
.bar .v{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right}
.matrix td.n{font-variant-numeric:tabular-nums}
.matrix td.hot{background:#fbe9c8}
.matrix td.hot2{background:#f5c87a}
details.src summary{cursor:pointer;color:var(--mute);font-size:12.5px}
pre.raw{white-space:pre-wrap;font:12px/1.6 var(--sans);background:#fff;border:1px solid var(--hair);padding:10px;max-height:260px;overflow:auto}
.footer{margin-top:40px;color:var(--mute);font-size:12px;border-top:1px solid var(--hair);padding-top:10px}
.ic{vertical-align:-3px;margin-right:6px;flex:none}
h2 .ic{color:var(--mute)}
.fact .ic{display:block;margin:0 0 6px;color:var(--mute)}
nav.tabs a .ic{margin-right:5px;vertical-align:-3px}
.badge .ic{margin-right:4px;vertical-align:-2px}
.logo{height:30px;vertical-align:-5px;margin-right:10px}

.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px 10px;min-width:420px;max-width:760px;max-height:60vh;overflow:auto;font-size:13px;border-radius:6px}
.pop h4{margin:0 0 8px;font:600 14px var(--serif);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pop h4 small{font:400 12px var(--sans);color:var(--mute)}
.pop .x{cursor:pointer;color:var(--mute);font-size:16px;line-height:1;padding:0 2px}
.pop table{width:100%;border-collapse:collapse}.pop td{padding:4px 8px;border-bottom:1px solid var(--hair);vertical-align:top;white-space:nowrap}.pop td.wrap{white-space:normal;max-width:300px}
.pop td a{font-weight:600;border-bottom:1px solid var(--hair2)}
.pop .dead{color:var(--mute)}
.pop .pstat{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 8px;padding:6px 8px;background:var(--bg);border-radius:4px;font-size:12px;color:var(--ink2)}.pop .pstat b{font-weight:600;color:var(--ink)}.pop .pstat span{white-space:nowrap}
.clk{cursor:pointer}.clk:hover{outline:2px solid var(--acc);outline-offset:-2px}
td.clk:hover{background:#f1e4c0 !important}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div id="font-chips" style="display:flex;gap:6px;align-items:center;margin:0 0 10px;font-size:12px;color:var(--mute)">글자 <span class="chip" data-z="1" style="padding:2px 10px">소</span><span class="chip" data-z="1.15" style="padding:2px 10px">중</span><span class="chip" data-z="1.3" style="padding:2px 10px">대</span></div>
    <h1>{{CO_LOGO}}{{CO_NAME}} 임원 <em>도감</em></h1>
    <div class="sub">DART 공시로 복원한 임원 생애 · <b id="hd-count"></b> · 기준 <b id="hd-date"></b> · 단일 파일 · <b id="hd-ver"></b></div>
  </div>
  <div id="scope-chips" style="align-self:center;margin-right:18px;flex:none;display:flex;flex-wrap:nowrap;border:1px solid var(--ink);border-radius:6px;overflow:hidden;font-size:13px;font-weight:600;white-space:nowrap"><span class="chip on" data-v="all" style="border:none;border-radius:0;padding:7px 14px;white-space:nowrap">전체 보기 <span class="num" id="cnt-all"></span></span><span class="chip" data-v="active" style="border:none;border-radius:0;padding:7px 14px;border-left:1px solid var(--ink);white-space:nowrap">현직자만 <span class="num" id="cnt-active"></span></span></div>
  <nav class="tabs" id="tabs">
    <a href="#/timeline">생애선</a><a href="#/people">명부</a><a href="#/origins">출신·스펙</a><a href="#/pay">보수·퇴직금</a><a href="#/affil">자회사·인선</a><a href="#/network">관계망</a><a href="#/about">자료·규칙</a>
  </nav>
</header>
<main id="main"></main>
<div class="tip" id="tip"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script id="affil" type="application/json">/*__AFFIL__*/</script>
<script>
const APP_VERSION='0.9.5';

const ICON={
 timeline:'<path d="M4 19h16"/><path d="M4 15h8"/><path d="M4 11h12"/><path d="M4 7h6"/><circle cx="18" cy="7" r="1.6"/>',
 play:'<path d="M7 5v14l11-7z"/>',
 list:'<path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/>',
 route:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h4"/>',
 coins:'<circle cx="9" cy="8" r="5"/><path d="M14 8a5 5 0 1 1 0 10"/><path d="M4 12v3a5 5 0 0 0 10 0v-3"/>',
 building:'<path d="M4 21V5l8-2v18"/><path d="M12 9l8 2v10"/><path d="M4 21h16"/><path d="M8 8h1M8 12h1M8 16h1M15 13h1M15 17h1"/>',
 network:'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4"/><path d="M12 11l-5.5 6.5"/><path d="M12 11l5.5 6.5"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8M8 15h5"/>',
 users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11a3 3 0 1 0-2-5.2"/><path d="M15 14.5a6 6 0 0 1 6 5.5"/>',
 user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
 userOff:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/><path d="M4 4l16 16"/>',
 calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',
 cake:'<path d="M4 20h16"/><path d="M5 20v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7"/><path d="M12 11V8"/><path d="M12 5.5c.8 0 1.5-.7 1.5-1.5S12 1.5 12 1.5 10.5 3.2 10.5 4 11.2 5.5 12 5.5z"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
 exit:'<path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M9 12h11"/><path d="M17 9l3 3-3 3"/>',
 cash:'<rect x="3" y="7" width="18" height="11" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10.5h.01M18 14.5h.01"/>',
 arrowUp:'<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/>',
 school:'<path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v4c0 1.5 2.3 3 5 3s5-1.5 5-3v-4"/><path d="M21 9v5"/>',
 pin:'<path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
 chart:'<path d="M4 20h16"/><path d="M7 16V10"/><path d="M12 16V6"/><path d="M17 16v-3"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
 check:'<path d="M5 12l5 5L20 7"/>',
 info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8h.01"/>',
};
const ic=(n,s=16,cls='')=>`<svg class="ic ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||''}</svg>`;

const DATA = JSON.parse(document.getElementById('data').textContent);
const AFFIL = JSON.parse(document.getElementById('affil').textContent||'{}'); AFFIL.terms=AFFIL.terms||[]; AFFIL.boards=AFFIL.boards||[]; AFFIL.s1_ceos=AFFIL.s1_ceos||[]; AFFIL.ceo_chain=AFFIL.ceo_chain||{};
const nthLabel = p => p.grade_nth ? `${(p.grade_title||p.title).replace(/대표이사/,'')} ${p.grade_nth}년차${p.grade_min?'↑':''}${p.nth_year&&p.nth_year!==p.grade_nth?` (임원 ${p.nth_year}년차)`:''}` : (p.nth_year?`임원 ${p.nth_year}년차`:'');
const afterlifeOf = pid => AFFIL.terms.filter(t=>t.s1_pid===pid);
function afterlifeTerms(p){ if(p.active||!p.exit_date) return []; const L=afterlifeOf(p.id).filter(t=>t.appointed&&t.appointed>=p.exit_date&&(t.position==='대표이사'||t.position==='사내이사')); const m={};
  L.forEach(t=>{const k=t.company+'|'+t.appointed; const isCEO=(AFFIL.ceo_chain[t.company]||[]).some(c=>c.name===p.name&&c.appointed===t.appointed); const pos=isCEO?'대표이사':t.position; if(!m[k]||pos==='대표이사') m[k]=Object.assign({},t,{position:pos});});
  return Object.values(m).sort((a,b)=>a.appointed>b.appointed?1:-1); }
const POP_SETS={}; let popSeq=0;
function popSet(title, list){const id='ps'+(++popSeq); POP_SETS[id]={title,ids:list.map(p=>p.id)}; return id;}
function popStats(L){
  const n=L.length; if(n<2) return '';
  const top=(f,k=3)=>{const c={}; L.forEach(p=>{const v=f(p); if(v)c[v]=(c[v]||0)+1}); return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,k).map(([v,m])=>`${esc(v)} ${m}`).join(' · ')};
  const med=a=>{a=a.filter(x=>x).sort((x,y)=>x-y); return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):null};
  const act=L.filter(p=>p.active).length, vp=L.filter(p=>/부사장|사장/.test(p.title)).length, mAge=med(L.map(p=>p.appt_age));
  const uniq=f=>new Set(L.map(f).filter(Boolean)).size>1; const tr=top(p=>p.track.replace(' 임원','').replace('(그룹 파견)',''),4), gr=uniq(p=>p.origin_group)?top(p=>p.origin_group):'', sc=uniq(p=>p.school)?top(p=>p.school):'', sec=top(p=>p.sector);
  return `<div class="pstat"><span><b>${n}명</b> 현직 ${act} · 퇴임 ${n-act}</span><span>부사장 이상 ${vp}</span>${mAge?`<span>선임 나이 중앙값 <b>${mAge}세</b></span>`:''}${tr?`<span>구분: ${tr}</span>`:''}${gr?`<span>출신: ${gr}</span>`:''}${sec?`<span>사업부: ${sec}</span>`:''}${sc?`<span>학교: ${sc}</span>`:''}</div>`;
}
function showPop(anchorEl, id){
  closePop(); const set=POP_SETS[id]; if(!set||!set.ids.length) return;
  const L=set.ids.map(i=>BY[i]).filter(Boolean).sort((a,b)=>(a.appt||'')>(b.appt||'')?1:-1);
  const el=document.createElement('div'); el.className='pop'; el.id='pop';
  el.innerHTML=`<h4><span>${esc(set.title)} <small>${L.length}명</small></span><span class="x" title="닫기">×</span></h4>${popStats(L)}<table>${L.map(p=>`<tr class="${p.active?'':'dead'}"><td><a href="#/person/${encodeURIComponent(p.id)}">${esc(p.name)}</a></td><td class="num">${p.appt_year||''}</td><td class="wrap">${esc(p.post_at_appt||p.job)}</td><td>${esc(p.title)}${p.active?'':' · 퇴임 '+esc(p.exit_label)}</td></tr>`).join('')}</table>`;
  document.body.appendChild(el);
  const r=anchorEl.getBoundingClientRect(); let x=r.left, y=r.bottom+6; const w=el.offsetWidth,hh=el.offsetHeight;
  if(x+w>innerWidth-12) x=innerWidth-12-w; if(y+hh>innerHeight-12) y=Math.max(12,r.top-hh-6);
  el.style.left=x+'px'; el.style.top=y+'px';
  el.querySelector('.x').onclick=closePop;
}
function closePop(){const e=document.getElementById('pop'); if(e) e.remove();}
document.addEventListener('click',e=>{const c=e.target.closest('[data-pop]'); if(c){e.stopPropagation(); showPop(c,c.dataset.pop); return;} if(!e.target.closest('#pop')) closePop();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
addEventListener('hashchange',closePop);
const VIEW={activeOnly:(()=>{try{return localStorage.getItem('s1_activeOnly')==='1'}catch(e){return false}})(),sector:null};
const secOf = p => (p.sector&&p.sector!=='미상')?p.sector:'전사·경영기획';
const vis = L => L.filter(p=>(!VIEW.activeOnly||p.active)&&(!VIEW.sector||secOf(p)===VIEW.sector));

function paySvg(p){
  const ys=Object.keys(p.pay_detail); const W=520,H=160,L=40,B=26,T=22; const max=Math.max(...ys.map(y=>p.pay_detail[y].총액)); const bw=Math.min(54,(W-L-20)/ys.length-10);
  const sy=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  [0,0.5,1].forEach(f=>{s+=`<line x1="${L}" x2="${W-10}" y1="${sy(max*f)}" y2="${sy(max*f)}" stroke="#ddd6c7"/><text x="${L-4}" y="${sy(max*f)+4}" font-size="10" text-anchor="end" class="mono" fill="#6c6a63">${Math.round(max*f/100*10)/10}억</text>`});
  ys.forEach((y,i)=>{const d=p.pay_detail[y]; const x=L+12+i*((W-L-20)/ys.length); let acc=0;
    [['급여','#15406f'],['상여','#3f7bc8'],['기타근로','#9fbfe6'],['퇴직','#8c2f39']].forEach(([k,c])=>{const v=d[k]||0;if(!v)return;const y1=sy(acc+v),y2=sy(acc);s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,y2-y1-1)}" fill="${c}"/>`;acc+=v});
    s+=`<text x="${x+bw/2}" y="${H-10}" font-size="11" text-anchor="middle" class="mono">${y}</text><text x="${x+bw/2}" y="${sy(d.총액)-4}" font-size="10.5" text-anchor="middle" class="mono">${(d.총액/100).toFixed(1)}</text>`});
  s+=`</svg><div class="legend"><span><i style="background:#15406f"></i>급여</span><span><i style="background:#3f7bc8"></i>상여</span><span><i style="background:#9fbfe6"></i>기타근로</span><span><i style="background:#8c2f39"></i>퇴직소득</span></div>`;
  return s;
}

function drawNet(){
  const el=$('#net'); const W=TL_W,H=720;
  const nodes=vis(netState.scope==='경영진'?MG:PEOPLE).map(p=>({p,x:W/2+(Math.random()-.5)*W*.6,y:H/2+(Math.random()-.5)*H*.6,vx:0,vy:0}));
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.p.id,i]));
  const edges=DATA.edges.filter(e=>netState.types[e.type]&&idx[e.a]!=null&&idx[e.b]!=null);
